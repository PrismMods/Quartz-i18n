# Deploy the static translation editor in site/ to GitHub Pages.
#
# Matches the existing workflow style (minimal, no extra deps). The Pages
# source must be set once in repo Settings → Pages → "Deploy from a branch" →
# branch "gh-pages" / root. This workflow rebuilds and force-pushes that branch
# whenever site/ changes, so it is fully hands-off after the one-time setting.
#
# The repo-root CNAME is published to gh-pages as well, which is what tells Pages
# the custom domain. DNS still has to point at GitHub separately: i18n.quartzz.xyz
# needs a CNAME record to prismmods.github.io.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # CNAME is published too (see below), so a domain change must redeploy.
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy site/ to gh-pages
        run: |
          set -e
          git fetch origin gh-pages:gh-pages --quiet || true
          git worktree add /tmp/pages gh-pages 2>/dev/null || git worktree add -b gh-pages /tmp/pages origin/main
          rm -rf /tmp/pages/*
          cp -r site/* /tmp/pages/
          # GitHub Pages reads the custom domain from a CNAME file on the PUBLISHED
          # branch, and this one lives at the repo root rather than in site/ — so it
          # never got copied and i18n.quartzz.xyz served "Site not found" while the
          # site itself was fine at prismmods.github.io/Quartz-i18n/. Publish it.
          # Deliberately not `[ -f CNAME ] && cp ...`: under `set -e` a missing file
          # would make the whole step exit non-zero.
          if [ -f CNAME ]; then
            cp CNAME /tmp/pages/
            echo "published custom domain: $(cat CNAME)"
          fi
          cd /tmp/pages
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git -c user.name="quartz-i18n-bot" \
              -c user.email="i18n-bot@users.noreply.github.com" \
              commit -m "deploy: publish site/ from ${GITHUB_SHA}"
          git push origin gh-pages
